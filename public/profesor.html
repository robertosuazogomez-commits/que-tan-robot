<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del profesor · ¿Qué tan robot eres?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Arial, sans-serif;
      background: #111; color: white; padding: 24px;
    }
    h1 { text-align: center; font-size: clamp(30px, 5vw, 46px); margin: 4px 0 6px; }
    .subtitle { text-align: center; font-size: 18px; color: #bbb; margin-bottom: 18px; }
    .round {
      width: fit-content; margin: 0 auto 22px; padding: 9px 18px;
      border: 1px solid #444; border-radius: 999px; color: #ddd;
      font-size: 14px; font-weight: 700; letter-spacing: .7px;
    }
    .stats { display: flex; justify-content: center; gap: 22px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat { background: #222; border-radius: 18px; padding: 20px 40px; text-align: center; min-width: 210px; }
    .stat-label { color: #aaa; font-size: 16px; margin-bottom: 8px; }
    .stat-value { font-size: 46px; font-weight: bold; }
    .chart {
      max-width: 1050px; margin: auto; display: flex; align-items: flex-end;
      justify-content: center; gap: 10px; height: 390px; padding: 20px;
      background: #1b1b1b; border-radius: 20px;
    }
    .bar-container { flex: 1; height: 100%; display: flex; flex-direction: column;
      justify-content: flex-end; align-items: center; min-width: 0; }
    .bar { width: 100%; max-width: 70px; background: white; border-radius: 8px 8px 0 0;
      transition: height .35s ease; min-height: 2px; }
    .bar-number { margin-top: 9px; font-size: 17px; font-weight: bold; }
    .bar-count { margin-bottom: 5px; font-size: 15px; color: #aaa; }
    .controls { text-align: center; margin-top: 24px; }
    .new-round {
      border: none; background: #4285f4; color: white; padding: 15px 28px;
      border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer;
    }
    .new-round:hover { background: #2f73df; }
    .new-round:disabled { opacity: .6; cursor: wait; }
    .note { color: #888; font-size: 12px; margin-top: 9px; }
    .history {
      max-width: 1050px; margin: 34px auto 0; background: #1b1b1b;
      border-radius: 18px; padding: 20px;
    }
    .history h2 { margin: 0 0 14px; font-size: 22px; }
    .history-empty { color: #888; font-size: 14px; }
    .history-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
      padding: 12px 8px; border-top: 1px solid #333; align-items: center;
    }
    .history-row strong { font-size: 16px; }
    .history-row span { color: #bbb; font-size: 14px; }
    @media (max-width: 600px) {
      body { padding: 14px; }
      .chart { height: 300px; gap: 4px; padding: 12px 7px; }
      .bar-number { font-size: 13px; }
      .bar-count { font-size: 11px; }
      .stat { min-width: 150px; padding: 16px 25px; }
      .stat-value { font-size: 38px; }
      .history-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <h1>🤖 ¿QUÉ TAN ROBOT ERES?</h1>
  <div class="subtitle">1 = Muy artificial · 10 = Muy humano</div>
  <div class="round" id="roundLabel">TEXTO 1 · VOTACIÓN ACTUAL</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">RESPUESTAS</div>
      <div class="stat-value" id="total">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">PROMEDIO</div>
      <div class="stat-value" id="average">—</div>
    </div>
  </div>

  <div class="chart" id="chart"></div>

  <div class="controls">
    <button class="new-round" id="newRoundButton" onclick="newRound()">
      ✓ GUARDAR Y NUEVA VOTACIÓN
    </button>
    <div class="note">Guarda los resultados del texto actual y prepara la votación para el siguiente texto.</div>
  </div>

  <section class="history">
    <h2>Resultados anteriores</h2>
    <div id="historyList" class="history-empty">Todavía no hay resultados guardados.</div>
  </section>

<script>
const chart = document.getElementById("chart");
const roundLabel = document.getElementById("roundLabel");
const newRoundButton = document.getElementById("newRoundButton");
const historyList = document.getElementById("historyList");

function createChart() {
  chart.innerHTML = "";
  for (let i = 1; i <= 10; i++) {
    const container = document.createElement("div");
    container.className = "bar-container";
    const count = document.createElement("div");
    count.className = "bar-count";
    count.id = "count-" + i;
    count.textContent = "0";
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.id = "bar-" + i;
    bar.style.height = "2px";
    const number = document.createElement("div");
    number.className = "bar-number";
    number.textContent = i;
    container.append(count, bar, number);
    chart.appendChild(container);
  }
}

function renderHistory(history) {
  if (!history.length) {
    historyList.className = "history-empty";
    historyList.textContent = "Todavía no hay resultados guardados.";
    return;
  }
  historyList.className = "";
  historyList.innerHTML = "";
  [...history].reverse().forEach(item => {
    const row = document.createElement("div");
    row.className = "history-row";
    row.innerHTML = `
      <strong>Texto ${item.textNumber}</strong>
      <span>${item.total} respuestas</span>
      <span>Promedio: <strong>${item.average}</strong></span>
    `;
    historyList.appendChild(row);
  });
}

async function updateResults() {
  try {
    const response = await fetch("/api/results");
    const data = await response.json();

    roundLabel.textContent = `TEXTO ${data.roundNumber} · VOTACIÓN ACTUAL`;
    document.getElementById("total").textContent = data.total;
    document.getElementById("average").textContent = data.total > 0 ? data.average : "—";

    const maximum = Math.max(...data.distribution, 1);
    for (let i = 1; i <= 10; i++) {
      const value = data.distribution[i - 1];
      document.getElementById("count-" + i).textContent = value;
      const height = (value / maximum) * 300;
      document.getElementById("bar-" + i).style.height = Math.max(height, 2) + "px";
    }
    renderHistory(data.history);
  } catch (error) {
    console.log("No se pudo actualizar.", error);
  }
}

async function newRound() {
  const currentTotal = Number(document.getElementById("total").textContent);
  if (currentTotal > 0) {
    const ok = confirm(
      `Se guardarán las ${currentTotal} respuestas del Texto ${document.getElementById("roundLabel").textContent.match(/TEXTO (\\d+)/)?.[1] || ""} y comenzará una nueva votación. ¿Continuar?`
    );
    if (!ok) return;
  } else {
    const ok = confirm("No hay respuestas en la votación actual. ¿Quieres comenzar una nueva votación?");
    if (!ok) return;
  }

  newRoundButton.disabled = true;
  try {
    const response = await fetch("/api/new-round", { method: "POST" });
    if (!response.ok) throw new Error("No se pudo crear la nueva votación.");
    await updateResults();
  } catch (error) {
    alert("No se pudo iniciar la nueva votación. Inténtalo nuevamente.");
  } finally {
    newRoundButton.disabled = false;
  }
}

createChart();
updateResults();
setInterval(updateResults, 1000);
</script>
</body>
</html>
