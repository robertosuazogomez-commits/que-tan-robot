<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Qué tan robot eres?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .instructions {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 18px 5px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      background: #e9e9e9;
    }

    button:hover {
      transform: scale(1.05);
    }

    button.selected {
      background: #111;
      color: white;
    }

    #voteButton {
      width: 100%;
      background: #111;
      color: white;
      font-size: 22px;
      padding: 18px;
      margin-top: 10px;
    }

    #voteButton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .labels {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🤖 ¿Qué tan robot eres?</h1>

    <div class="instructions">
      Elige un número del 1 al 10.
    </div>

    <div class="scale" id="scale"></div>

    <div class="labels">
      <span>1 = Muy robot</span>
      <span>10 = Muy humano</span>
    </div>

    <button id="voteButton" disabled>
      VOTAR
    </button>

    <div id="message"></div>

  </div>

  <script>

    let selectedValue = null;

    const scale = document.getElementById("scale");
    const voteButton = document.getElementById("voteButton");
    const message = document.getElementById("message");

    for (let i = 1; i <= 10; i++) {

      const button = document.createElement("button");

      button.textContent = i;

      button.addEventListener("click", () => {

        selectedValue = i;

        document.querySelectorAll(".scale button")
          .forEach(btn => btn.classList.remove("selected"));

        button.classList.add("selected");

        voteButton.disabled = false;

      });

      scale.appendChild(button);
    }

    voteButton.addEventListener("click", async () => {

      if (!selectedValue) return;

      voteButton.disabled = true;

      try {

        const response = await fetch("/api/vote", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            value: selectedValue
          })

        });

        if (!response.ok) {
          throw new Error("Error");
        }

        message.textContent = "✅ ¡Respuesta registrada!";

        document.querySelectorAll(".scale button")
          .forEach(btn => btn.disabled = true);

      } catch (error) {

        message.textContent =
          "❌ No se pudo enviar la respuesta.";

        voteButton.disabled = false;
      }

    });

  </script>

</body>
</html>
